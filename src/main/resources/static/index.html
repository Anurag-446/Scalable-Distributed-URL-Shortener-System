<!DOCTYPE html>
<html>
<head>
<title>URL Shortener Visualization</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #0f172a, #020617);
    color: white;
}

/* BACKGROUND PARTICLES */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
}

.bg span {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #22c55e;
    border-radius: 50%;
    animation: float 10s linear infinite;
    opacity: 0.5;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}

/* MAIN */
.main {
    position: relative;
    z-index: 2;
    text-align: center;
    top: 50%;
    transform: translateY(-50%);
}

h1 {
    margin-bottom: 20px;
}

input {
    padding: 12px;
    width: 350px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 12px 18px;
    background: #3b82f6;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    margin-left: 10px;
}

/* GRAPH */
.scene {
    margin-top: 40px;
}

.graph {
    width: 600px;
    height: 350px;
    position: relative;
    margin: auto;
}

/* NODES (NO ANIMATION NOW) */
.node {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ef4444;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 15px #ef4444;
    transition: 0.3s;
}

.node.active {
    background: #22c55e;
    box-shadow: 0 0 25px #22c55e;
}

/* POSITIONS */
#user { top: 130px; left: 40px; }
#api { top: 20px; left: 260px; }
#db { top: 240px; left: 260px; }
#short { top: 130px; left: 480px; }

/* LINES */
.line {
    position: absolute;
    height: 3px;
    background: #ef4444;
    transform-origin: left;
}

.line.active {
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
}

/* DATA FLOW ANIMATION */
.line.active::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    animation: move 1s linear infinite;
}

@keyframes move {
    from { left: 0; }
    to { left: 100%; }
}

#l1 { top: 160px; left: 120px; width: 160px; transform: rotate(-25deg); }
#l2 { top: 160px; left: 120px; width: 160px; transform: rotate(25deg); }
#l3 { top: 160px; left: 340px; width: 140px; }

/* RESULT */
#result {
    margin-top: 20px;
}

a {
    color: #22c55e;
}

</style>
</head>

<body>

<!-- BACKGROUND PARTICLES -->
<div class="bg">
<script>
for (let i = 0; i < 60; i++) {
    let span = document.createElement("span");
    span.style.left = Math.random() * 100 + "%";
    span.style.animationDuration = (5 + Math.random()*5) + "s";
    document.currentScript.parentElement.appendChild(span);
}
</script>
</div>

<div class="main">

<h1>🔗 URL Shortener Visualization</h1>

<input type="text" id="url" placeholder="Enter long URL">
<button onclick="startProcess()">Shorten</button>

<div class="scene">
    <div class="graph">

        <div class="node" id="user">User</div>
        <div class="node" id="api">API</div>
        <div class="node" id="db">DB</div>
        <div class="node" id="short">Short</div>

        <div class="line" id="l1"></div>
        <div class="line" id="l2"></div>
        <div class="line" id="l3"></div>

    </div>
</div>

<div id="result"></div>

</div>

<script>
function activate(id) {
    document.getElementById(id).classList.add("active");
}

function activateLine(id) {
    document.getElementById(id).classList.add("active");
}

function startProcess() {

    let url = document.getElementById("url").value;

    if (!url) {
        alert("Enter URL!");
        return;
    }

    document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.line').forEach(l => l.classList.remove('active'));

    setTimeout(() => activate("user"), 500);
    setTimeout(() => activateLine("l1"), 1000);
    setTimeout(() => activate("api"), 1500);
    setTimeout(() => activateLine("l2"), 2000);
    setTimeout(() => activate("db"), 2500);
    setTimeout(() => activate("api"), 3000);
    setTimeout(() => activateLine("l3"), 3500);
    setTimeout(() => activate("short"), 4000);

    setTimeout(() => {
        fetch("/shorten", {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: url
        })
        .then(res => res.text())
        .then(data => {
            document.getElementById("result").innerHTML =
                "Short URL:<br><a href='" + data + "' target='_blank'>" + data + "</a>";
        });
    }, 4500);
}
</script>

</body>
</html>
